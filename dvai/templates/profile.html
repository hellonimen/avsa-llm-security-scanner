{% extends "base.html" %}
{% block title %} — Profile{% endblock %}
{% block content %}
<section class="card">
  <h1>Profile</h1>
  <dl class="profile">
    <dt>Username</dt><dd>{{ user['username'] }}</dd>
    <dt>Display name</dt><dd>{{ user['display_name'] }}</dd>
    <dt>Member since</dt><dd>{{ user['created_at'] }}</dd>
  </dl>
</section>
{% endblock %}
