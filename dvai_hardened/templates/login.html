{% extends "base.html" %}
{% block title %} — Log in{% endblock %}
{% block content %}
<section class="card">
  <h1>Log in</h1>
  <p class="muted">Welcome back — sign in to continue chatting.</p>
  <form method="post" action="{{ url_for('login') }}">
    <label>Username
      <input type="text" name="username" required autofocus>
    </label>
    <label>Password
      <input type="password" name="password" required>
    </label>
    <button type="submit">Log in</button>
  </form>
  <p class="muted">No account yet? <a href="{{ url_for('register') }}">Register</a>.</p>
</section>
{% endblock %}
